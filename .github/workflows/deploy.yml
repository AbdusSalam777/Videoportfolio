name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch: # lets you re-run a deploy by hand from the Actions tab

concurrency:
  # Never let two deploys touch the server at once.
  group: vps-deploy
  cancel-in-progress: false

jobs:
  build-check:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Fail here rather than on the VPS: a broken build must not reach the
      # server and take the live site down on restart.
      - run: npm run build
        env:
          # Build-time placeholders; the real values live in .env.local on the
          # VPS and are read at runtime.
          ADMIN_PASSWORD: build-only
          SESSION_SECRET: build-only-not-a-real-secret

  deploy:
    name: Deploy
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/vidportfolio

            git fetch --all
            git reset --hard origin/master

            # Dev dependencies are required to build (typescript, tailwind).
            npm ci --no-audit --no-fund
            npm run build

            pm2 restart vidportfolio --update-env
            pm2 save

            sleep 3
            pm2 describe vidportfolio | grep -q "status.*online" \
              || { echo "App is not online after restart"; pm2 logs vidportfolio --lines 50 --nostream; exit 1; }
            echo "Deployed $(git rev-parse --short HEAD)"
